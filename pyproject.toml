[project]
name = "looped-models-research"
version = "0.1.0"
description = "Controlled research on useful recurrent transformer depth"
requires-python = ">=3.9"
dependencies = ["torch>=2.4", "numpy>=1.26"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
plots = ["matplotlib>=3.9,<4"]
bpe = ["tokenizers>=0.20,<1", "pyarrow>=15,<22"]

[tool.setuptools.packages.find]
include = ["looped_models*"]
